name: CI

on:
  push:
    branches: [main, codex/public-readiness]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Generated-image foreground extraction uses Apple Vision on macOS 14+.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run typecheck
      - run: npx vitest run packages/pixel-art packages/schema packages/state-engine packages/runtime-core packages/runtime-react packages/plugin-sdk packages/design-core
